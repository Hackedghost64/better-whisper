[package]
name = "better_whisper_core"
version = "0.1.0"
edition = "2021"
authors = ["Better Whisper Team"]
description = "High-performance, zero-latency text cleaning and audio flow engine for Wispr Flow offline alternative"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4"

[dev-dependencies]
